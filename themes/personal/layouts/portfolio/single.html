{{ define "main" }}
<article class="page-content">
  <h1>{{ .Title }}</h1>
  {{ with .Params.tagline }}<p class="portfolio-tagline lead">{{ . }}</p>{{ end }}

  {{ with .Params.tags }}
  <div class="portfolio-tags">
    {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
  </div>
  {{ end }}

  {{ with .Params.links }}
  <div class="portfolio-links">
    {{ range . }}
    <a href="{{ .url }}" class="btn" target="_blank" rel="noopener">{{ .label }}</a>
    {{ end }}
  </div>
  {{ end }}

  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
