    description: An open-source TypeScript library that makes error handling a compiler concern rather than a matter of team discipline. Brings Rust-style Result&lt;T, E&gt; types, structured tagged errors, ergonomic cancellation, and clean framework boundaries to everyday TypeScript — with zero runtime dependencies.
    tags: [TypeScript, Open Source, Functional Programming]
    url: "https://github.com/adotomov/explicit-ts"

